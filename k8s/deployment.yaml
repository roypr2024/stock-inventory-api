apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-inventory-api
  labels:
    app: stock-inventory-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stock-inventory-api
  template:
    metadata:
      labels:
        app: stock-inventory-api
    spec:
      containers:
      - name: stock-inventory-api
        image: dummy-image   # Will be updated by CI/CD
        ports:
        - containerPort: 8000
        env:
        - name: ENVIRONMENT
          value: "development"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: stock-api-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: stock-api-secrets
              key: redis-url
        - name: CACHE_TTL_SECONDS
          value: "7200"
        resources:
          requests:
            cpu: "150m"
            memory: "384Mi"
          limits:
            cpu: "600m"
            memory: "768Mi"