apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-inventory-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stock-inventory-api
  template:
    metadata:
      labels:
        app: stock-inventory-api
    spec:
      containers:
      - name: stock-inventory-api
        image: acrstockinv2026.azurecr.io/stock-inventory-api:latest   # Will be updated by CI/CD
        ports:
        - containerPort: 8000
        env:
        - name: ENVIRONMENT
          value: "dev"     # Will be overridden per namespace later
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: stock-api-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: stock-api-secrets
              key: redis-url