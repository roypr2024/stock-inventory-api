name: Build & Deploy to AKS

on:
  push:
    branches: [ dev, stage, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}          # We will add this secret next
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ secrets.IMAGE_NAME }}:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ secrets.IMAGE_NAME }}:${{ github.sha }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group ${{ secrets.RESOURCE_GROUP }} --name ${{ secrets.AKS_CLUSTER_NAME }} --overwrite-existing

      - name: Deploy to AKS
        run: |
          # Choose namespace based on branch
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            NAMESPACE="production"
          elif [[ "${{ github.ref }}" == "refs/heads/stage" ]]; then
            NAMESPACE="staging"
          else
            NAMESPACE="development"
          fi

          echo "Deploying to namespace: $NAMESPACE"

          kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -

          # Apply manifests
          kubectl apply -f k8s/ -n $NAMESPACE

          # Update image (use the short SHA for faster updates)
          kubectl set image deployment/stock-inventory-api \
            stock-inventory-api=${{ secrets.ACR_LOGIN_SERVER }}/${{ secrets.IMAGE_NAME }}:${{ github.sha }} \
            -n $NAMESPACE

          echo "Deployment completed to $NAMESPACE"