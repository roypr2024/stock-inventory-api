name: Build and Deploy to AKS

on:
  push:
    branches: [ dev, stage, master ]
  pull_request:
    branches: [ dev, stage, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and Push Docker Image to ACR
        uses: azure/acr-build@v1
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          image: ${{ secrets.IMAGE_NAME }}
          tags: |
            latest
            ${{ github.sha }}
          context: .
          file: ./Dockerfile

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Get AKS Credentials
        run: |
          az aks get-credentials --resource-group ${{ secrets.RESOURCE_GROUP }} --name ${{ secrets.AKS_CLUSTER_NAME }} --overwrite-existing

      - name: Deploy to AKS (Different namespace per branch)
        run: |
          BRANCH=${{ github.ref_name }}
          
          if [ "$BRANCH" = "master" ]; then
            NAMESPACE="production"
          elif [ "$BRANCH" = "stage" ]; then
            NAMESPACE="staging"
          else
            NAMESPACE="development"
          fi

          echo "Deploying to namespace: $NAMESPACE"

          # Create namespace if not exists
          kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -

          # Deploy application
          kubectl apply -f k8s/ -n $NAMESPACE

          # Update image tag
          kubectl set image deployment/stock-inventory-api stock-inventory-api=${{ secrets.ACR_LOGIN_SERVER }}/${{ secrets.IMAGE_NAME }}:${{ github.sha }} -n $NAMESPACE